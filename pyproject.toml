[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "insightme"
version = "0.1.0"
description = "Personal analytics tool for iMessage and Call History on macOS"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.0",
    "streamlit>=1.30",
    "wordcloud>=1.9",
    "emoji>=2.0",
]

[project.scripts]
insightme = "insightme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
