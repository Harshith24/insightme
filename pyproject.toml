[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightme"
version = "0.1.2"
description = "Personal analytics tool for iMessage and Call History on macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.24",
    "streamlit>=1.30",
    "wordcloud>=1.9",
    "emoji>=2.0",
]

[project.urls]
Repository = "https://github.com/Harshith24/insightme"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
insightme = "insightme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["insightme*"]
namespaces = false
